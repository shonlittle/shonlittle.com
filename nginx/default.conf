server {
  listen 80;
  server_name shonlittle.com;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    # Serve a prerendered snapshot (e.g. /software/index.html) when one exists.
    try_files $uri $uri/index.html /index.html;
  }
}
